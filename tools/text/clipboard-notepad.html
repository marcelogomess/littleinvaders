            <h1 class="tool-title">Clipboard Notepad</h1>
            <p class="tool-description">Persistent notepad with auto-save</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="notepad-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="notepad-text" class="tool-label">
                            Notes
                            <span id="char-count" style="color: var(--text-muted); font-size: 0.875rem; margin-left: var(--spacing-sm);">0 characters</span>
                        </label>
                        <textarea id="notepad-text" class="tool-textarea" placeholder="Start typing..."></textarea>
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="clear-btn">Clear</button>
                        <button type="button" class="tool-btn tool-btn-secondary" data-copy="notepad-text">Copy All</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>
                </form>

    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const notepad = document.getElementById('notepad-text');
            const charCount = document.getElementById('char-count');
            const clearBtn = document.getElementById('clear-btn');
            const feedback = document.getElementById('feedback');

            // Load from localStorage
            const saved = localStorage.getItem('notepad-text');
            if (saved) {
                notepad.value = saved;
            }

            function updateCharCount() {
                charCount.textContent = notepad.value.length + ' characters';
            }

            // Auto-save
            notepad.addEventListener('input', function() {
                localStorage.setItem('notepad-text', this.value);
                updateCharCount();
            });

            clearBtn.addEventListener('click', function() {
                if (confirm('Clear all notes?')) {
                    notepad.value = '';
                    localStorage.removeItem('notepad-text');
                    updateCharCount();
                    showFeedback('Notepad cleared!', 'success');
                }
            });

            updateCharCount();

            function showFeedback(message, type) {
                feedback.className = 'tool-feedback ' + type + ' show';
                feedback.textContent = message;
                setTimeout(function() { feedback.classList.remove('show'); }, 3000);
            }
        });
    </script>
