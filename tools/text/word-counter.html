    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">Word & Character Counter</h1>
            <p class="tool-description">Count words, characters, and more</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="counter-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="input-text" class="tool-label">Text</label>
                        <textarea id="input-text" class="tool-textarea" placeholder="Enter text to count"></textarea>
                    </div>

                    <div class="tool-form-group" style="margin-top: var(--spacing-md);">
                        <label class="tool-label">Statistics</label>
                        <div style="background: rgba(0, 0, 0, 0.5); border: var(--border-pixel) var(--border-color); padding: var(--spacing-md);">
                            <div style="margin-bottom: var(--spacing-xs);"><strong style="color: var(--accent-cyan);">Characters:</strong> <span id="char-count">0</span></div>
                            <div style="margin-bottom: var(--spacing-xs);"><strong style="color: var(--accent-green);">Words:</strong> <span id="word-count">0</span></div>
                            <div style="margin-bottom: var(--spacing-xs);"><strong style="color: var(--accent-purple);">Lines:</strong> <span id="line-count">0</span></div>
                            <div><strong style="color: var(--accent-pink);">Paragraphs:</strong> <span id="para-count">0</span></div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../assets/js/tools-core.js"></script>
    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('input-text');
            const charCount = document.getElementById('char-count');
            const wordCount = document.getElementById('word-count');
            const lineCount = document.getElementById('line-count');
            const paraCount = document.getElementById('para-count');

            function updateCounts() {
                const text = input.value;
                charCount.textContent = text.length;
                wordCount.textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
                lineCount.textContent = text ? text.split('\n').length : 0;
                paraCount.textContent = text.trim() ? text.trim().split(/\n\s*\n/).length : 0;
            }

            input.addEventListener('input', updateCounts);
            updateCounts();
        });
    </script>
