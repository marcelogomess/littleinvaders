        <div class="tool-header">
            <h1 class="tool-title">Text Case Converter</h1>
            <p class="tool-description">Convert text between different cases</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="case-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="input-text" class="tool-label">Input Text</label>
                        <textarea id="input-text" class="tool-textarea" placeholder="Enter text to convert"></textarea>
                    </div>

                    <div class="tool-form-group">
                        <label class="tool-label">Case Options</label>
                        <div class="tool-radio-group">
                            <label class="tool-radio"><input type="radio" name="case" value="lowercase" checked><span>lowercase</span></label>
                            <label class="tool-radio"><input type="radio" name="case" value="uppercase"><span>UPPERCASE</span></label>
                            <label class="tool-radio"><input type="radio" name="case" value="title"><span>Title Case</span></label>
                            <label class="tool-radio"><input type="radio" name="case" value="sentence"><span>Sentence case</span></label>
                            <label class="tool-radio"><input type="radio" name="case" value="camel"><span>camelCase</span></label>
                            <label class="tool-radio"><input type="radio" name="case" value="pascal"><span>PascalCase</span></label>
                            <label class="tool-radio"><input type="radio" name="case" value="snake"><span>snake_case</span></label>
                            <label class="tool-radio"><input type="radio" name="case" value="kebab"><span>kebab-case</span></label>
                        </div>
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="convert-btn">Convert</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div class="tool-form-group" style="margin-top: var(--spacing-md);">
                        <label for="output-text" class="tool-label">
                            Output
                            <button type="button" class="tool-copy-btn" data-copy="output-text" title="Copy">📋</button>
                        </label>
                        <textarea id="output-text" class="tool-textarea tool-output tool-output-empty" readonly></textarea>
                    </div>
                </form>
            </div>

    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('input-text');
            const output = document.getElementById('output-text');
            const convertBtn = document.getElementById('convert-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            function convertCase(text, caseType) {
                switch(caseType) {
                    case 'lowercase': return text.toLowerCase();
                    case 'uppercase': return text.toUpperCase();
                    case 'title': return text.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
                    case 'sentence': return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
                    case 'camel': return text.split(/[\s_-]+/).map((w, i) => i === 0 ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join('');
                    case 'pascal': return text.split(/[\s_-]+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join('');
                    case 'snake': return text.split(/[\s-]+/).map(w => w.toLowerCase()).join('_');
                    case 'kebab': return text.split(/[\s_]+/).map(w => w.toLowerCase()).join('-');
                    default: return text;
                }
            }

            convertBtn.addEventListener('click', function() {
                const text = input.value.trim();
                if (!text) {
                    showFeedback('Please enter text', 'error');
                    return;
                }
                const caseType = document.querySelector('input[name="case"]:checked').value;
                output.value = convertCase(text, caseType);
                output.classList.remove('tool-output-empty');
                showFeedback('Text converted!', 'success');
            });

            resetBtn.addEventListener('click', function() {
                resetForm('case-form');
            });

            function showFeedback(message, type) {
                feedback.className = 'tool-feedback ' + type + ' show';
                feedback.textContent = message;
                setTimeout(function() { feedback.classList.remove('show'); }, 3000);
            }
        });
    </script>
