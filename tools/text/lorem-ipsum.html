    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">Lorem Ipsum Generator</h1>
            <p class="tool-description">Generate placeholder text</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="lorem-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="paragraphs" class="tool-label">Number of Paragraphs</label>
                        <input type="number" id="paragraphs" class="tool-input" value="3" min="1" max="50">
                    </div>

                    <div class="tool-form-group">
                        <label for="words-per-para" class="tool-label">Words per Paragraph</label>
                        <input type="number" id="words-per-para" class="tool-input" value="50" min="1" max="500">
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="generate-btn">Generate</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div class="tool-form-group" style="margin-top: var(--spacing-md);">
                        <label for="output-text" class="tool-label">
                            Generated Text
                            <button type="button" class="tool-copy-btn" data-copy="output-text" title="Copy">📋</button>
                        </label>
                        <textarea id="output-text" class="tool-textarea tool-output tool-output-empty" readonly></textarea>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->

    <script src="../../assets/js/tools-core.js"></script>
    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const paragraphs = document.getElementById('paragraphs');
            const wordsPerPara = document.getElementById('words-per-para');
            const output = document.getElementById('output-text');
            const generateBtn = document.getElementById('generate-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            const loremWords = ['lorem', 'ipsum', 'dolor', 'sit', 'amet', 'consectetur', 'adipiscing', 'elit', 'sed', 'do', 'eiusmod', 'tempor', 'incididunt', 'ut', 'labore', 'et', 'dolore', 'magna', 'aliqua'];

            function generateLorem(numParagraphs, wordsPerParagraph) {
                let result = '';
                for (let p = 0; p < numParagraphs; p++) {
                    let paragraph = '';
                    for (let w = 0; w < wordsPerParagraph; w++) {
                        paragraph += loremWords[Math.floor(Math.random() * loremWords.length)];
                        if (w < wordsPerParagraph - 1) paragraph += ' ';
                    }
                    result += paragraph + (p < numParagraphs - 1 ? '\n\n' : '');
                }
                return result;
            }

            generateBtn.addEventListener('click', function() {
                const numParas = parseInt(paragraphs.value) || 3;
                const words = parseInt(wordsPerPara.value) || 50;
                output.value = generateLorem(numParas, words);
                output.classList.remove('tool-output-empty');
                showFeedback('Lorem ipsum generated!', 'success');
            });

            resetBtn.addEventListener('click', function() {
                resetForm('lorem-form');
            });

            function showFeedback(message, type) {
                feedback.className = 'tool-feedback ' + type + ' show';
                feedback.textContent = message;
                setTimeout(function() { feedback.classList.remove('show'); }, 3000);
            }
        });
    </script>
