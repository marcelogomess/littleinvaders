    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">Gas Fee Calculator</h1>
            <p class="tool-description">Calculate Ethereum gas fees</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="gas-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="gas-limit" class="tool-label">Gas Limit</label>
                        <input type="number" id="gas-limit" class="tool-input" value="21000" min="1">
                    </div>

                    <div class="tool-form-group">
                        <label for="gas-price" class="tool-label">Gas Price (Gwei)</label>
                        <input type="number" id="gas-price" class="tool-input" value="20" min="0" step="0.1">
                    </div>

                    <div class="tool-form-group">
                        <label for="network" class="tool-label">Network</label>
                        <select id="network" class="tool-select">
                            <option value="ethereum">Ethereum Mainnet</option>
                            <option value="polygon">Polygon</option>
                            <option value="arbitrum">Arbitrum</option>
                            <option value="optimism">Optimism</option>
                        </select>
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="calculate-btn">Calculate</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div class="tool-form-group" style="margin-top: var(--spacing-md);">
                        <label class="tool-label">Gas Fee</label>
                        <div style="background: rgba(0, 0, 0, 0.5); border: var(--border-pixel) var(--border-color); padding: var(--spacing-md);">
                            <div style="margin-bottom: var(--spacing-sm);">
                                <strong style="color: var(--accent-cyan);">Total Gas:</strong>
                                <span id="total-gas" class="tool-output-empty" style="margin-left: var(--spacing-sm);"></span>
                            </div>
                            <div style="margin-bottom: var(--spacing-sm);">
                                <strong style="color: var(--accent-green);">Cost (ETH):</strong>
                                <span id="cost-eth" class="tool-output-empty" style="margin-left: var(--spacing-sm);"></span>
                            </div>
                            <div>
                                <strong style="color: var(--accent-purple);">Cost (USD):</strong>
                                <span id="cost-usd" class="tool-output-empty" style="margin-left: var(--spacing-sm);"></span>
                                <span style="color: var(--text-muted); font-size: 0.875rem;">(estimated)</span>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gasLimit = document.getElementById('gas-limit');
            const gasPrice = document.getElementById('gas-price');
            const network = document.getElementById('network');
            const totalGas = document.getElementById('total-gas');
            const costEth = document.getElementById('cost-eth');
            const costUsd = document.getElementById('cost-usd');
            const calculateBtn = document.getElementById('calculate-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            // Estimated ETH prices (placeholder - would normally fetch from API)
            const ethPrices = {
                ethereum: 2500,
                polygon: 0.7,
                arbitrum: 0.5,
                optimism: 0.5
            };

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            calculateBtn.addEventListener('click', function() {
                const limit = parseFloat(gasLimit.value) || 0;
                const price = parseFloat(gasPrice.value) || 0;

                if (limit <= 0 || price <= 0) {
                    showFeedback('Please enter valid gas limit and price', 'error');
                    return;
                }

                const totalGasWei = BigInt(Math.floor(limit * price * 1e9));
                const totalGasGwei = (limit * price).toFixed(2);
                const totalGasEth = weiToEth(totalGasWei.toString());

                totalGas.textContent = totalGasGwei + ' Gwei';
                costEth.textContent = totalGasEth + ' ETH';

                const ethPrice = ethPrices[network.value] || 2500;
                const usdCost = (parseFloat(totalGasEth) * ethPrice).toFixed(2);
                costUsd.textContent = '$' + usdCost;

                totalGas.classList.remove('tool-output-empty');
                costEth.classList.remove('tool-output-empty');
                costUsd.classList.remove('tool-output-empty');

                showFeedback('Gas fee calculated!', 'success');
            });

            resetBtn.addEventListener('click', function() {
                resetForm('gas-form');
                totalGas.textContent = '';
                costEth.textContent = '';
                costUsd.textContent = '';
                totalGas.classList.add('tool-output-empty');
                costEth.classList.add('tool-output-empty');
                costUsd.classList.add('tool-output-empty');
            });
        });
    </script>
