    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">NFT Metadata Viewer</h1>
            <p class="tool-description">View and format NFT metadata JSON</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="nft-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="metadata-input" class="tool-label">NFT Metadata JSON</label>
                        <textarea id="metadata-input" class="tool-textarea" placeholder='{"name": "...", "description": "...", "image": "...", "attributes": [...]}'></textarea>
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="parse-btn">Parse & Display</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="format-btn">Format JSON</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div class="tool-form-group" style="margin-top: var(--spacing-md);">
                        <label class="tool-label">Formatted View</label>
                        <div id="formatted-view" class="tool-output tool-output-empty" style="padding: var(--spacing-md);"></div>
                    </div>

                    <div class="tool-form-group">
                        <label for="json-output" class="tool-label">
                            Formatted JSON
                            <button type="button" class="tool-copy-btn" data-copy="json-output" title="Copy">📋</button>
                        </label>
                        <textarea id="json-output" class="tool-textarea tool-output tool-output-empty" readonly></textarea>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../assets/js/tools-core.js"></script>
    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const metadataInput = document.getElementById('metadata-input');
            const formattedView = document.getElementById('formatted-view');
            const jsonOutput = document.getElementById('json-output');
            const parseBtn = document.getElementById('parse-btn');
            const formatBtn = document.getElementById('format-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            function formatMetadata(metadata) {
                let html = '<div style="line-height: 1.8;">';
                
                if (metadata.name) {
                    html += `<div style="margin-bottom: var(--spacing-sm);"><strong style="color: var(--accent-cyan);">Name:</strong> ${metadata.name}</div>`;
                }
                
                if (metadata.description) {
                    html += `<div style="margin-bottom: var(--spacing-sm);"><strong style="color: var(--accent-green);">Description:</strong> ${metadata.description}</div>`;
                }
                
                if (metadata.image) {
                    html += `<div style="margin-bottom: var(--spacing-sm);"><strong style="color: var(--accent-purple);">Image:</strong> <a href="${metadata.image}" target="_blank" style="color: var(--accent-cyan);">${metadata.image}</a></div>`;
                }
                
                if (metadata.attributes && Array.isArray(metadata.attributes)) {
                    html += '<div style="margin-top: var(--spacing-md);"><strong style="color: var(--accent-cyan);">Attributes:</strong><ul style="margin-left: var(--spacing-md); margin-top: var(--spacing-xs);">';
                    metadata.attributes.forEach(attr => {
                        const trait = attr.trait_type || attr.name || 'Unknown';
                        const value = attr.value || '';
                        html += `<li>${trait}: ${value}</li>`;
                    });
                    html += '</ul></div>';
                }
                
                html += '</div>';
                return html;
            }

            parseBtn.addEventListener('click', function() {
                const text = metadataInput.value.trim();
                if (!text) {
                    showFeedback('Please enter metadata JSON', 'error');
                    return;
                }

                try {
                    const metadata = JSON.parse(text);
                    formattedView.innerHTML = formatMetadata(metadata);
                    jsonOutput.value = JSON.stringify(metadata, null, 2);
                    formattedView.classList.remove('tool-output-empty');
                    jsonOutput.classList.remove('tool-output-empty');
                    showFeedback('Metadata parsed successfully!', 'success');
                } catch (e) {
                    showFeedback('Invalid JSON: ' + e.message, 'error');
                    formattedView.innerHTML = '';
                    jsonOutput.value = '';
                    formattedView.classList.add('tool-output-empty');
                    jsonOutput.classList.add('tool-output-empty');
                }
            });

            formatBtn.addEventListener('click', function() {
                const text = metadataInput.value.trim();
                if (!text) {
                    showFeedback('Please enter metadata JSON', 'error');
                    return;
                }

                try {
                    const metadata = JSON.parse(text);
                    jsonOutput.value = JSON.stringify(metadata, null, 2);
                    jsonOutput.classList.remove('tool-output-empty');
                    showFeedback('JSON formatted successfully!', 'success');
                } catch (e) {
                    showFeedback('Invalid JSON: ' + e.message, 'error');
                }
            });

            resetBtn.addEventListener('click', function() {
                resetForm('nft-form');
                formattedView.innerHTML = '';
                formattedView.classList.add('tool-output-empty');
            });
        });
    </script>
</body>
</html>
