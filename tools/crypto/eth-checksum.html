    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const address = document.getElementById('address');
            const checksumOutput = document.getElementById('checksum-output');
            const validationStatus = document.getElementById('validation-status');
            const convertBtn = document.getElementById('convert-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            convertBtn.addEventListener('click', async function() {
                const addr = address.value.trim();
                if (!addr) {
                    showFeedback('Please enter an address', 'error');
                    return;
                }

                if (!isValidEthAddress(addr)) {
                    showFeedback('Invalid Ethereum address format', 'error');
                    checksumOutput.value = '';
                    checksumOutput.classList.add('tool-output-empty');
                    validationStatus.textContent = '✗ Invalid format';
                    validationStatus.className = 'tool-output error';
                    return;
                }

                try {
                    const checksummed = await toChecksumAddress(addr);
                    checksumOutput.value = checksummed;
                    checksumOutput.classList.remove('tool-output-empty');
                    
                    const isValid = checksummed.toLowerCase() === addr.toLowerCase() || checksummed === addr;
                    validationStatus.textContent = isValid ? '✓ Valid checksummed address' : '⚠ Address converted to checksum format';
                    validationStatus.className = 'tool-output ' + (isValid ? 'success' : 'info');
                    validationStatus.classList.remove('tool-output-empty');
                    
                    showFeedback('Address converted successfully!', 'success');
                } catch (e) {
                    showFeedback('Error: ' + e.message, 'error');
                }
            });

            resetBtn.addEventListener('click', function() {
                resetForm('checksum-form');
                validationStatus.textContent = '';
                validationStatus.classList.add('tool-output-empty');
            });
        });
    </script>
