    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const amount = document.getElementById('amount');
            const unit = document.getElementById('unit');
            const weiOutput = document.getElementById('wei-output');
            const gweiOutput = document.getElementById('gwei-output');
            const ethOutput = document.getElementById('eth-output');
            const convertBtn = document.getElementById('convert-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            convertBtn.addEventListener('click', function() {
                const value = amount.value.trim();
                if (!value) {
                    showFeedback('Please enter an amount', 'error');
                    return;
                }

                try {
                    let wei;
                    const inputUnit = unit.value;

                    if (inputUnit === 'wei') {
                        wei = BigInt(value);
                    } else if (inputUnit === 'gwei') {
                        wei = gweiToWei(value);
                    } else {
                        wei = ethToWei(value);
                    }

                    weiOutput.textContent = wei.toString();
                    gweiOutput.textContent = weiToGwei(wei.toString());
                    ethOutput.textContent = weiToEth(wei.toString());

                    weiOutput.classList.remove('tool-output-empty');
                    gweiOutput.classList.remove('tool-output-empty');
                    ethOutput.classList.remove('tool-output-empty');

                    showFeedback('Converted successfully!', 'success');
                } catch (e) {
                    showFeedback('Error: ' + e.message, 'error');
                }
            });

            resetBtn.addEventListener('click', function() {
                resetForm('eth-form');
                weiOutput.textContent = '';
                gweiOutput.textContent = '';
                ethOutput.textContent = '';
                weiOutput.classList.add('tool-output-empty');
                gweiOutput.classList.add('tool-output-empty');
                ethOutput.classList.add('tool-output-empty');
            });
        });
    </script>
