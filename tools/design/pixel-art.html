    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">Pixel Art Generator</h1>
            <p class="tool-description">Convert images to pixel art</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="pixel-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="image-input" class="tool-label">Select Image</label>
                        <input type="file" id="image-input" class="tool-input" accept="image/*">
                    </div>

                    <div class="tool-form-group">
                        <label for="pixel-size" class="tool-label">Pixel Size: <span id="pixel-size-value">8</span>px</label>
                        <input type="range" id="pixel-size" class="tool-slider" min="2" max="32" value="8">
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="generate-btn">Generate</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="download-btn" style="display: none;">Download</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div id="preview-container" style="display: none; margin-top: var(--spacing-md); text-align: center;">
                        <canvas id="pixel-canvas" style="border: var(--border-pixel) var(--border-color); image-rendering: pixelated; max-width: 100%;"></canvas>

    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const imageInput = document.getElementById('image-input');
            const pixelSize = document.getElementById('pixel-size');
            const pixelSizeValue = document.getElementById('pixel-size-value');
            const generateBtn = document.getElementById('generate-btn');
            const downloadBtn = document.getElementById('download-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');
            const previewContainer = document.getElementById('preview-container');
            const canvas = document.getElementById('pixel-canvas');

            pixelSize.addEventListener('input', function() {
                pixelSizeValue.textContent = this.value;
            });

            generateBtn.addEventListener('click', function() {
                const file = imageInput.files[0];
                if (!file) {
                    showFeedback('Please select an image', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const size = parseInt(pixelSize.value);
                        const width = Math.floor(img.width / size) * size;
                        const height = Math.floor(img.height / size) * size;
                        const pixelWidth = width / size;
                        const pixelHeight = height / size;

                        canvas.width = pixelWidth;
                        canvas.height = pixelHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = false;

                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = width;
                        tempCanvas.height = height;
                        const tempCtx = tempCanvas.getContext('2d');
                        tempCtx.drawImage(img, 0, 0, width, height);

                        for (let y = 0; y < pixelHeight; y++) {
                            for (let x = 0; x < pixelWidth; x++) {
                                const px = x * size;
                                const py = y * size;
                                const pixelData = tempCtx.getImageData(px, py, size, size);
                                let r = 0, g = 0, b = 0, a = 0;
                                for (let i = 0; i < pixelData.data.length; i += 4) {
                                    r += pixelData.data[i];
                                    g += pixelData.data[i + 1];
                                    b += pixelData.data[i + 2];
                                    a += pixelData.data[i + 3];
                                }
                                const count = pixelData.data.length / 4;
                                ctx.fillStyle = 'rgba(' + Math.round(r/count) + ', ' + Math.round(g/count) + ', ' + Math.round(b/count) + ', ' + (Math.round(a/count)/255) + ')';
                                ctx.fillRect(x, y, 1, 1);
                            }
                        }

                        previewContainer.style.display = 'block';
                        downloadBtn.style.display = 'inline-block';
                        showFeedback('Pixel art generated!', 'success');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });

            downloadBtn.addEventListener('click', function() {
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'pixel-art.png';
                    link.click();
                    URL.revokeObjectURL(url);
                    showFeedback('Pixel art downloaded!', 'success');
                });
            });

            resetBtn.addEventListener('click', function() {
                resetForm('pixel-form');
                previewContainer.style.display = 'none';
                downloadBtn.style.display = 'none';
            });

            function showFeedback(message, type) {
                feedback.className = 'tool-feedback ' + type + ' show';
                feedback.textContent = message;
                setTimeout(function() { feedback.classList.remove('show'); }, 3000);
            }
        });
    </script>
