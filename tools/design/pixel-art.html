                    <div class="tool-form-group">

                    <div class="tool-form-group">

                        <div style="margin-top: var(--spacing-xs); font-size: 0.875rem; color: var(--text-muted);">

                    <div class="tool-btn-group">

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const imageInput = document.getElementById('image-input');
            const pixelSize = document.getElementById('pixel-size');
            const pixelSizeValue = document.getElementById('pixel-size-value');
            const outputScale = document.getElementById('output-scale');
            const outputScaleValue = document.getElementById('output-scale-value');
            const generateBtn = document.getElementById('generate-btn');
            const downloadBtn = document.getElementById('download-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');
            const previewContainer = document.getElementById('preview-container');
            const canvas = document.getElementById('pixel-canvas');

            pixelSize.addEventListener('input', function() {
                pixelSizeValue.textContent = this.value;
            });

            outputScale.addEventListener('input', function() {
                outputScaleValue.textContent = this.value;
            });

            generateBtn.addEventListener('click', function() {
                const file = imageInput.files[0];
                if (!file) {
                    showFeedback('Please select an image', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const pixelationLevel = parseInt(pixelSize.value);
                        const scale = parseInt(outputScale.value);
                        
                        // Calculate the downscaled dimensions (smaller = more pixelated)
                        const downscaledWidth = Math.max(1, Math.floor(img.width / pixelationLevel));
                        const downscaledHeight = Math.max(1, Math.floor(img.height / pixelationLevel));
                        
                        // Create a small canvas for the pixelated version
                        const smallCanvas = document.createElement('canvas');
                        smallCanvas.width = downscaledWidth;
                        smallCanvas.height = downscaledHeight;
                        const smallCtx = smallCanvas.getContext('2d');
                        smallCtx.imageSmoothingEnabled = false;
                        
                        // Draw the image scaled down (this creates the pixelation effect)
                        smallCtx.drawImage(img, 0, 0, downscaledWidth, downscaledHeight);
                        
                        // Get the pixel data from the small canvas
                        const pixelData = smallCtx.getImageData(0, 0, downscaledWidth, downscaledHeight);
                        
                        // Create the output canvas (scaled up for visibility)
                        const outputWidth = downscaledWidth * scale;
                        const outputHeight = downscaledHeight * scale;
                        canvas.width = outputWidth;
                        canvas.height = outputHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = false;
                        
                        // Draw each pixel from the small canvas as a larger block
                        for (let y = 0; y < downscaledHeight; y++) {
                            for (let x = 0; x < downscaledWidth; x++) {
                                const index = (y * downscaledWidth + x) * 4;
                                const r = pixelData.data[index];
                                const g = pixelData.data[index + 1];
                                const b = pixelData.data[index + 2];
                                const a = pixelData.data[index + 3];
                                
                                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${a / 255})`;
                                ctx.fillRect(x * scale, y * scale, scale, scale);
                            }
                        }

                        previewContainer.style.display = 'block';
                        downloadBtn.style.display = 'inline-block';
                        showFeedback('Pixel art generated!', 'success');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });

            downloadBtn.addEventListener('click', function() {
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'pixel-art.png';
                    link.click();
                    URL.revokeObjectURL(url);
                    showFeedback('Pixel art downloaded!', 'success');
                });
            });

            resetBtn.addEventListener('click', function() {
                resetForm('pixel-form');
                previewContainer.style.display = 'none';
                downloadBtn.style.display = 'none';
            });

            function showFeedback(message, type) {
                feedback.className = 'tool-feedback ' + type + ' show';
                feedback.textContent = message;
                setTimeout(function() { feedback.classList.remove('show'); }, 3000);
            }
        });
    </script>
