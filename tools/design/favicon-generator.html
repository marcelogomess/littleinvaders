    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">Favicon Generator</h1>
            <p class="tool-description">Generate favicons from images or text</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="favicon-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="mode" class="tool-label">Mode</label>
                        <select id="mode" class="tool-select">
                            <option value="image">From Image</option>
                            <option value="text">From Text</option>
                        </select>
                    </div>

                    <div class="tool-form-group" id="image-group">
                        <label for="image-input" class="tool-label">Select Image</label>
                        <input type="file" id="image-input" class="tool-input" accept="image/*">
                    </div>

                    <div class="tool-form-group" id="text-group" style="display: none;">
                        <label for="text-input" class="tool-label">Text</label>
                        <input type="text" id="text-input" class="tool-input" placeholder="LI" maxlength="2">
                    </div>

                    <div class="tool-form-group">
                        <label for="size" class="tool-label">Size</label>
                        <select id="size" class="tool-select">
                            <option value="16">16x16</option>
                            <option value="32">32x32</option>
                            <option value="48">48x48</option>
                        </select>
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="generate-btn">Generate</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="download-btn" style="display: none;">Download</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div id="preview-container" style="display: none; margin-top: var(--spacing-md); text-align: center;">
                        <canvas id="favicon-canvas" style="border: var(--border-pixel) var(--border-color); image-rendering: pixelated;"></canvas>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mode = document.getElementById('mode');
            const imageGroup = document.getElementById('image-group');
            const textGroup = document.getElementById('text-group');
            const imageInput = document.getElementById('image-input');
            const textInput = document.getElementById('text-input');
            const size = document.getElementById('size');
            const generateBtn = document.getElementById('generate-btn');
            const downloadBtn = document.getElementById('download-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');
            const previewContainer = document.getElementById('preview-container');
            const canvas = document.getElementById('favicon-canvas');

            mode.addEventListener('change', function() {
                if (this.value === 'image') {
                    imageGroup.style.display = 'block';
                    textGroup.style.display = 'none';
                } else {
                    imageGroup.style.display = 'none';
                    textGroup.style.display = 'block';
                }
            });

            generateBtn.addEventListener('click', function() {
                const faviconSize = parseInt(size.value);
                canvas.width = faviconSize;
                canvas.height = faviconSize;
                const ctx = canvas.getContext('2d');

                if (mode.value === 'image') {
                    const file = imageInput.files[0];
                    if (!file) {
                        showFeedback('Please select an image', 'error');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            ctx.drawImage(img, 0, 0, faviconSize, faviconSize);
                            previewContainer.style.display = 'block';
                            downloadBtn.style.display = 'inline-block';
                            showFeedback('Favicon generated!', 'success');
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                } else {
                    const text = textInput.value.trim() || 'LI';
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(0, 0, faviconSize, faviconSize);
                    ctx.fillStyle = '#000000';
                    ctx.font = `bold ${faviconSize * 0.6}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-pixel')}`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, faviconSize / 2, faviconSize / 2);
                    previewContainer.style.display = 'block';
                    downloadBtn.style.display = 'inline-block';
                    showFeedback('Favicon generated!', 'success');
                }
            });

            downloadBtn.addEventListener('click', function() {
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `favicon-${size.value}x${size.value}.png`;
                    link.click();
                    URL.revokeObjectURL(url);
                    showFeedback('Favicon downloaded!', 'success');
                });
            });

            resetBtn.addEventListener('click', function() {
                resetForm('favicon-form');
                previewContainer.style.display = 'none';
                downloadBtn.style.display = 'none';
            });

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }
        });
    </script>
</body>
