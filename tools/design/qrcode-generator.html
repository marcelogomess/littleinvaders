    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('qrcode-input');
            const generateBtn = document.getElementById('generate-btn');
            const resultDiv = document.getElementById('qrcode-result');
            const qrcodeImage = document.getElementById('qrcode-image');
            const downloadBtn = document.getElementById('download-btn');
            const feedback = document.getElementById('feedback');
            const colorDarkPicker = document.getElementById('qrcode-color-dark');
            const colorDarkHex = document.getElementById('qrcode-color-dark-hex');
            const colorLightPicker = document.getElementById('qrcode-color-light');
            const colorLightHex = document.getElementById('qrcode-color-light-hex');
            const presetForegroundColors = document.querySelectorAll('.qrcode-preset-foreground');
            const presetBackgroundColors = document.querySelectorAll('.qrcode-preset-background');
            let qrcodeInstance = null;

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            function updateColorHex(input, hexInput) {
                hexInput.value = input.value.toUpperCase();
            }

            function updateColorPicker(hexInput, picker) {
                const hex = hexInput.value.trim();
                if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
                    picker.value = hex;
                }
            }

            // Sync color picker with hex input
            colorDarkPicker.addEventListener('input', function() {
                updateColorHex(colorDarkPicker, colorDarkHex);
            });

            colorLightPicker.addEventListener('input', function() {
                updateColorHex(colorLightPicker, colorLightHex);
            });

            // Sync hex input with color picker
            colorDarkHex.addEventListener('input', function() {
                updateColorPicker(colorDarkHex, colorDarkPicker);
            });

            colorLightHex.addEventListener('input', function() {
                updateColorPicker(colorLightHex, colorLightPicker);
            });

            // Preset foreground color buttons
            presetForegroundColors.forEach(btn => {
                btn.addEventListener('click', function() {
                    const color = this.getAttribute('data-color');
                    colorDarkPicker.value = color;
                    colorDarkHex.value = color.toUpperCase();
                });
            });

            // Preset background color buttons
            presetBackgroundColors.forEach(btn => {
                btn.addEventListener('click', function() {
                    const color = this.getAttribute('data-color');
                    colorLightPicker.value = color;
                    colorLightHex.value = color.toUpperCase();
                });
            });

            generateBtn.addEventListener('click', function() {
                const text = input.value.trim();
                
                if (!text) {
                    showFeedback('Please enter some text or URL', 'error');
                    return;
                }

                // Get colors from inputs
                let darkColor = colorDarkHex.value.trim();
                let lightColor = colorLightHex.value.trim();

                // Validate hex colors
                if (!/^#[0-9A-Fa-f]{6}$/.test(darkColor)) {
                    darkColor = colorDarkPicker.value;
                    colorDarkHex.value = darkColor.toUpperCase();
                }
                if (!/^#[0-9A-Fa-f]{6}$/.test(lightColor)) {
                    lightColor = colorLightPicker.value;
                    colorLightHex.value = lightColor.toUpperCase();
                }

                qrcodeImage.innerHTML = '';
                
                qrcodeInstance = new QRCode(qrcodeImage, {
                    text: text,
                    width: 256,
                    height: 256,
                    colorDark: darkColor,
                    colorLight: lightColor,
                    correctLevel: QRCode.CorrectLevel.H
                });

                resultDiv.style.display = 'block';
                showFeedback('QR code generated!', 'success');
            });

            downloadBtn.addEventListener('click', function() {
                const canvas = qrcodeImage.querySelector('canvas');
                if (canvas) {
                    canvas.toBlob(function(blob) {
                        // Generate filename with timestamp
                        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5); // Format: YYYY-MM-DDTHH-MM-SS
                        const filename = `qrcode-${timestamp}.png`;
                        
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.download = filename;
                        link.href = url;
                        link.click();
                        URL.revokeObjectURL(url);
                        showFeedback('QR code downloaded!', 'success');
                    });
                }
            });

            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    generateBtn.click();
                }
            });

            document.getElementById('reset-btn').addEventListener('click', function() {
                resetForm('qrcode-form');
                resultDiv.style.display = 'none';
                qrcodeImage.innerHTML = '';
                // Reset colors to default
                colorDarkPicker.value = '#00ffff';
                colorDarkHex.value = '#00FFFF';
                colorLightPicker.value = '#000000';
                colorLightHex.value = '#000000';
            });
        });
    </script>
