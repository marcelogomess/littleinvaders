    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="../../assets/js/tools-core.js"></script>
    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('qrcode-input');
            const generateBtn = document.getElementById('generate-btn');
            const resultDiv = document.getElementById('qrcode-result');
            const qrcodeImage = document.getElementById('qrcode-image');
            const downloadBtn = document.getElementById('download-btn');
            const feedback = document.getElementById('feedback');
            let qrcodeInstance = null;

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            generateBtn.addEventListener('click', function() {
                const text = input.value.trim();
                
                if (!text) {
                    showFeedback('Please enter some text or URL', 'error');
                    return;
                }

                qrcodeImage.innerHTML = '';
                
                qrcodeInstance = new QRCode(qrcodeImage, {
                    text: text,
                    width: 256,
                    height: 256,
                    colorDark: "#00ffff",
                    colorLight: "#000000",
                    correctLevel: QRCode.CorrectLevel.H
                });

                resultDiv.style.display = 'block';
                showFeedback('QR code generated!', 'success');
            });

            downloadBtn.addEventListener('click', function() {
                const canvas = qrcodeImage.querySelector('canvas');
                if (canvas) {
                    canvas.toBlob(function(blob) {
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.download = 'qrcode.png';
                        link.href = url;
                        link.click();
                        URL.revokeObjectURL(url);
                        showFeedback('QR code downloaded!', 'success');
                    });
                }
            });

            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    generateBtn.click();
                }
            });

            document.getElementById('reset-btn').addEventListener('click', function() {
                resetForm('qrcode-form');
                resultDiv.style.display = 'none';
                qrcodeImage.innerHTML = '';
            });
        });
    </script>
