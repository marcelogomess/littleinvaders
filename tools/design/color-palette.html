    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const imageInput = document.getElementById('image-input');
            const extractBtn = document.getElementById('extract-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');
            const paletteContainer = document.getElementById('palette-container');
            const paletteColors = document.getElementById('palette-colors');

            extractBtn.addEventListener('click', function() {
                const file = imageInput.files[0];
                if (!file) {
                    showFeedback('Please select an image', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);

                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const colors = {};
                        const sample = 10;

                        for (let i = 0; i < imageData.data.length; i += sample * 4) {
                            const r = imageData.data[i];
                            const g = imageData.data[i + 1];
                            const b = imageData.data[i + 2];
                            const key = `${Math.floor(r/32)*32},${Math.floor(g/32)*32},${Math.floor(b/32)*32}`;
                            colors[key] = (colors[key] || 0) + 1;
                        }

                        const sorted = Object.entries(colors).sort((a, b) => b[1] - a[1]).slice(0, 8);
                        paletteColors.innerHTML = '';

                        sorted.forEach(function(item) {
                            const color = item[0];
                            const count = item[1];
                            const parts = color.split(',');
                            const r = parseInt(parts[0]);
                            const g = parseInt(parts[1]);
                            const b = parseInt(parts[2]);
                            const hex = rgbToHex(r, g, b);
                            const div = document.createElement('div');
                            div.style.cssText = 'background: ' + hex + '; border: var(--border-pixel) var(--border-color); padding: var(--spacing-md); text-align: center; cursor: pointer;';
                            const contrast = getContrastRatio(hex, '#000000');
                            div.innerHTML = '<div style="color: ' + (contrast > 4.5 ? '#000' : '#fff') + '; font-size: 0.875rem;">' + hex + '</div>';
                            div.addEventListener('click', function() { copyToClipboard(hex, div); });
                            paletteColors.appendChild(div);
                        });

                        paletteContainer.style.display = 'block';
                        showFeedback('Colors extracted!', 'success');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });

            resetBtn.addEventListener('click', function() {
                resetForm('palette-form');
                paletteContainer.style.display = 'none';
            });

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }
        });
    </script>
