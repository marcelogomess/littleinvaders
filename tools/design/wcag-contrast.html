    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">WCAG Contrast Checker</h1>
            <p class="tool-description">Check color contrast for accessibility</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="contrast-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="fg-color" class="tool-label">Foreground Color</label>
                        <input type="color" id="fg-color" class="tool-input" value="#ffffff" style="height: 50px;">
                    </div>

                    <div class="tool-form-group">
                        <label for="bg-color" class="tool-label">Background Color</label>
                        <input type="color" id="bg-color" class="tool-input" value="#000000" style="height: 50px;">
                    </div>

                    <div class="tool-form-group">
                        <label class="tool-label">Preview</label>
                        <div id="contrast-preview" class="tool-preview" style="min-height: 100px; display: flex; align-items: center; justify-content: center; padding: var(--spacing-md);">
                            <span style="font-size: 1.5rem;">Sample Text</span>
                        </div>
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="check-btn">Check Contrast</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div class="tool-form-group" style="margin-top: var(--spacing-md);">
                        <label class="tool-label">Results</label>
                        <div id="results" class="tool-output tool-output-empty" style="padding: var(--spacing-md);"></div>
                    </div>
                </form>
            </div>

    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fgColor = document.getElementById('fg-color');
            const bgColor = document.getElementById('bg-color');
            const preview = document.getElementById('contrast-preview');
            const results = document.getElementById('results');
            const checkBtn = document.getElementById('check-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            function updatePreview() {
                preview.style.color = fgColor.value;
                preview.style.backgroundColor = bgColor.value;
            }

            [fgColor, bgColor].forEach(el => {
                el.addEventListener('input', updatePreview);
            });

            checkBtn.addEventListener('click', function() {
                const ratio = getContrastRatio(fgColor.value, bgColor.value);
                const aa = ratio >= 4.5;
                const aaLarge = ratio >= 3;
                const aaa = ratio >= 7;
                const aaaLarge = ratio >= 4.5;

                let html = `<div style="line-height: 1.8;">
                    <div><strong style="color: var(--accent-cyan);">Contrast Ratio:</strong> ${ratio.toFixed(2)}:1</div>
                    <div style="margin-top: var(--spacing-sm);">
                        <div style="margin-bottom: var(--spacing-xs);"><strong>WCAG AA:</strong> ${aa ? '✓ Pass' : '✗ Fail'} (Normal text requires 4.5:1)</div>
                        <div style="margin-bottom: var(--spacing-xs);"><strong>WCAG AA Large:</strong> ${aaLarge ? '✓ Pass' : '✗ Fail'} (Large text requires 3:1)</div>
                        <div style="margin-bottom: var(--spacing-xs);"><strong>WCAG AAA:</strong> ${aaa ? '✓ Pass' : '✗ Fail'} (Normal text requires 7:1)</div>
                        <div><strong>WCAG AAA Large:</strong> ${aaaLarge ? '✓ Pass' : '✗ Fail'} (Large text requires 4.5:1)</div>
                    </div>
                </div>`;

                results.innerHTML = html;
                results.classList.remove('tool-output-empty');
                showFeedback('Contrast checked!', 'success');
            });

            resetBtn.addEventListener('click', function() {
                resetForm('contrast-form');
                fgColor.value = '#ffffff';
                bgColor.value = '#000000';
                updatePreview();
                results.innerHTML = '';
                results.classList.add('tool-output-empty');
            });

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            updatePreview();
        });
    </script>
