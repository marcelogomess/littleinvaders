    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">Image Resizer</h1>
            <p class="tool-description">Resize images</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="resizer-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="image-input" class="tool-label">Select Image</label>
                        <input type="file" id="image-input" class="tool-input" accept="image/*">
                    </div>

                    <div class="tool-form-group">
                        <label for="percentage" class="tool-label">Resize Percentage (%)</label>
                        <input type="number" id="percentage" class="tool-input" placeholder="100" min="1" max="1000" value="100">
                        <div style="margin-top: var(--spacing-xs); font-size: 0.875rem; color: var(--text-muted);">
                            <span id="dimensions-info">Original: -</span>
                        </div>
                    </div>

                    <div class="tool-form-group">
                        <label class="tool-label">Quick Presets</label>
                        <div style="display: flex; gap: var(--spacing-xs); flex-wrap: wrap;">
                            <button type="button" class="percentage-preset" data-percent="25">25%</button>
                            <button type="button" class="percentage-preset" data-percent="50">50%</button>
                            <button type="button" class="percentage-preset" data-percent="75">75%</button>
                            <button type="button" class="percentage-preset" data-percent="100">100%</button>
                            <button type="button" class="percentage-preset" data-percent="150">150%</button>
                            <button type="button" class="percentage-preset" data-percent="200">200%</button>
                        </div>
                    </div>


                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="resize-btn">Resize</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="download-btn" style="display: none;">Download</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div id="preview-container" style="display: none; margin-top: var(--spacing-md); text-align: center;">
                        <img id="resized-preview" style="max-width: 100%; border: var(--border-pixel) var(--border-color);">
                    </div>
                </form>
            </div>
        </div>

    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const imageInput = document.getElementById('image-input');
            const percentage = document.getElementById('percentage');
            const dimensionsInfo = document.getElementById('dimensions-info');
            const resizeBtn = document.getElementById('resize-btn');
            const downloadBtn = document.getElementById('download-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');
            const previewContainer = document.getElementById('preview-container');
            const resizedPreview = document.getElementById('resized-preview');
            const presetButtons = document.querySelectorAll('.percentage-preset');
            let resizedDataUrl = null;
            let originalWidth = 0;
            let originalHeight = 0;

            function updateDimensionsInfo() {
                if (originalWidth && originalHeight) {
                    const percent = parseFloat(percentage.value) || 100;
                    const newWidth = Math.round(originalWidth * percent / 100);
                    const newHeight = Math.round(originalHeight * percent / 100);
                    dimensionsInfo.textContent = `Original: ${originalWidth} × ${originalHeight}px → New: ${newWidth} × ${newHeight}px (${percent}%)`;
                } else {
                    dimensionsInfo.textContent = 'Original: -';
                }
            }

            // Preset button handlers
            presetButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const percent = this.getAttribute('data-percent');
                    percentage.value = percent;
                    updateDimensionsInfo();
                });
            });

            // Update dimensions info when percentage changes
            percentage.addEventListener('input', updateDimensionsInfo);

            imageInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            originalWidth = img.width;
                            originalHeight = img.height;
                            percentage.value = 100;
                            updateDimensionsInfo();
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            resizeBtn.addEventListener('click', function() {
                const file = imageInput.files[0];
                if (!file) {
                    showFeedback('Please select an image', 'error');
                    return;
                }

                const percent = parseFloat(percentage.value);
                if (!percent || percent <= 0) {
                    showFeedback('Please enter a valid percentage (1-1000)', 'error');
                    return;
                }

                if (!originalWidth || !originalHeight) {
                    showFeedback('Please wait for image to load', 'error');
                    return;
                }

                const targetWidth = Math.round(originalWidth * percent / 100);
                const targetHeight = Math.round(originalHeight * percent / 100);

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                        resizedDataUrl = canvas.toDataURL('image/png');
                        resizedPreview.src = resizedDataUrl;
                        previewContainer.style.display = 'block';
                        downloadBtn.style.display = 'inline-block';
                        showFeedback(`Image resized to ${percent}%!`, 'success');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });

            downloadBtn.addEventListener('click', function() {
                if (resizedDataUrl) {
                    downloadFile(resizedDataUrl, 'resized-image.png', 'image/png');
                    showFeedback('Image downloaded!', 'success');
                }
            });

            resetBtn.addEventListener('click', function() {
                resetForm('resizer-form');
                previewContainer.style.display = 'none';
                downloadBtn.style.display = 'none';
                resizedDataUrl = null;
                originalWidth = 0;
                originalHeight = 0;
                percentage.value = 100;
                updateDimensionsInfo();
            });

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }
        });
    </script>
