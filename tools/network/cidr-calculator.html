    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ipInput = document.getElementById('ip-address');
            const cidrInput = document.getElementById('cidr-prefix');
            const feedback = document.getElementById('feedback');
            const resultsSection = document.getElementById('results-section');
            const resetBtn = document.getElementById('reset-btn');

            // Result elements
            const networkAddress = document.getElementById('network-address');
            const broadcastAddress = document.getElementById('broadcast-address');
            const subnetMask = document.getElementById('subnet-mask');
            const firstUsable = document.getElementById('first-usable');
            const lastUsable = document.getElementById('last-usable');
            const totalHosts = document.getElementById('total-hosts');

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            function validateIPv4(ip) {
                const regex = /^(\d{1,3}\.){3}\d{1,3}$/;
                if (!regex.test(ip)) {
                    return false;
                }
                const parts = ip.split('.');
                return parts.every(part => {
                    const num = parseInt(part, 10);
                    return num >= 0 && num <= 255;
                });
            }

            function ipToInt(ip) {
                const parts = ip.split('.').map(Number);
                return (parts[0] << 24) | (parts[1] << 16) | (parts[2] << 8) | parts[3];
            }

            function intToIP(int) {
                return [
                    (int >>> 24) & 0xFF,
                    (int >>> 16) & 0xFF,
                    (int >>> 8) & 0xFF,
                    int & 0xFF
                ].join('.');
            }

            function calculateCIDR() {
                const ip = ipInput.value.trim();
                const cidrStr = cidrInput.value.trim();

                if (!ip || !cidrStr) {
                    resultsSection.style.display = 'none';
                    return;
                }

                if (!validateIPv4(ip)) {
                    showFeedback('Invalid IPv4 address format', 'error');
                    resultsSection.style.display = 'none';
                    return;
                }

                const cidr = parseInt(cidrStr, 10);
                if (isNaN(cidr) || cidr < 0 || cidr > 32) {
                    showFeedback('CIDR prefix must be between 0 and 32', 'error');
                    resultsSection.style.display = 'none';
                    return;
                }

                // Calculate subnet mask
                const subnetMaskInt = cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0;

                // Convert IP to integer
                const ipInt = ipToInt(ip);

                // Calculate network address
                const networkInt = ipInt & subnetMaskInt;

                // Calculate broadcast address
                const broadcastInt = networkInt | (~subnetMaskInt >>> 0);

                // Calculate usable IPs
                let firstUsableInt, lastUsableInt, totalHostsCount;

                if (cidr === 32) {
                    // Single host
                    firstUsableInt = networkInt;
                    lastUsableInt = networkInt;
                    totalHostsCount = 1;
                } else if (cidr === 31) {
                    // Point-to-point (no broadcast)
                    firstUsableInt = networkInt;
                    lastUsableInt = broadcastInt;
                    totalHostsCount = 2;
                } else {
                    // Normal subnet
                    firstUsableInt = networkInt + 1;
                    lastUsableInt = broadcastInt - 1;
                    totalHostsCount = Math.pow(2, 32 - cidr) - 2;
                }

                // Display results
                networkAddress.value = intToIP(networkInt);
                broadcastAddress.value = intToIP(broadcastInt);
                subnetMask.value = intToIP(subnetMaskInt);
                firstUsable.value = intToIP(firstUsableInt);
                lastUsable.value = intToIP(lastUsableInt);
                totalHosts.value = totalHostsCount.toLocaleString();

                // Remove empty class from outputs
                [networkAddress, broadcastAddress, subnetMask, firstUsable, lastUsable, totalHosts].forEach(el => {
                    el.classList.remove('tool-output-empty');
                });

                resultsSection.style.display = 'block';
            }

            // Live calculation on input change
            ipInput.addEventListener('input', calculateCIDR);
            cidrInput.addEventListener('input', calculateCIDR);

            // Initial calculation
            calculateCIDR();

            resetBtn.addEventListener('click', function() {
                resetForm('cidr-form');
                ipInput.value = '192.168.1.10';
                cidrInput.value = '24';
                resultsSection.style.display = 'none';
                [networkAddress, broadcastAddress, subnetMask, firstUsable, lastUsable, totalHosts].forEach(el => {
                    el.value = '';
                    el.classList.add('tool-output-empty');
                });
                calculateCIDR();
            });
        });
    </script>
