    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "HTTP Status Code Explorer",
      "url": "https://littleinvaders.com/tools/network/http-status-codes.html",

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const resultsCount = document.getElementById('results-count');
            const container = document.getElementById('status-codes-container');

            // HTTP Status Codes Dataset
            const statusCodes = [
                // 1xx Informational
                { code: 100, name: 'Continue', description: 'The server has received the request headers and the client should proceed to send the request body.', category: '1xx' },
                { code: 101, name: 'Switching Protocols', description: 'The requester has asked the server to switch protocols and the server has agreed.', category: '1xx' },
                { code: 102, name: 'Processing', description: 'The server has received and is processing the request, but no response is available yet.', category: '1xx' },
                { code: 103, name: 'Early Hints', description: 'Used to return some response headers before final HTTP message.', category: '1xx' },
                
                // 2xx Success
                { code: 200, name: 'OK', description: 'The request has succeeded.', category: '2xx' },
                { code: 201, name: 'Created', description: 'The request has been fulfilled and resulted in a new resource being created.', category: '2xx' },
                { code: 202, name: 'Accepted', description: 'The request has been accepted for processing, but the processing has not been completed.', category: '2xx' },
                { code: 204, name: 'No Content', description: 'The server successfully processed the request but is not returning any content.', category: '2xx' },
                { code: 206, name: 'Partial Content', description: 'The server is delivering only part of the resource due to a range header sent by the client.', category: '2xx' },
                
                // 3xx Redirection
                { code: 301, name: 'Moved Permanently', description: 'The URL of the requested resource has been changed permanently.', category: '3xx' },
                { code: 302, name: 'Found', description: 'The URL of the requested resource has been changed temporarily.', category: '3xx' },
                { code: 304, name: 'Not Modified', description: 'Indicates that the resource has not been modified since the version specified by the request headers.', category: '3xx' },
                { code: 307, name: 'Temporary Redirect', description: 'The request should be repeated with another URL, but future requests should still use the original URL.', category: '3xx' },
                { code: 308, name: 'Permanent Redirect', description: 'The request and all future requests should be repeated using another URL.', category: '3xx' },
                
                // 4xx Client Error
                { code: 400, name: 'Bad Request', description: 'The server cannot or will not process the request due to an apparent client error.', category: '4xx' },
                { code: 401, name: 'Unauthorized', description: 'Authentication is required and has failed or has not yet been provided.', category: '4xx' },
                { code: 403, name: 'Forbidden', description: 'The request was valid, but the server is refusing action.', category: '4xx' },
                { code: 404, name: 'Not Found', description: 'The requested resource could not be found but may be available in the future.', category: '4xx' },
                { code: 405, name: 'Method Not Allowed', description: 'A request method is not supported for the requested resource.', category: '4xx' },
                { code: 408, name: 'Request Timeout', description: 'The server timed out waiting for the request.', category: '4xx' },
                { code: 409, name: 'Conflict', description: 'The request could not be processed because of conflict in the request.', category: '4xx' },
                { code: 410, name: 'Gone', description: 'The resource requested is no longer available and will not be available again.', category: '4xx' },
                { code: 413, name: 'Payload Too Large', description: 'The request is larger than the server is willing or able to process.', category: '4xx' },
                { code: 414, name: 'URI Too Long', description: 'The URI provided was too long for the server to process.', category: '4xx' },
                { code: 415, name: 'Unsupported Media Type', description: 'The request entity has a media type which the server or resource does not support.', category: '4xx' },
                { code: 429, name: 'Too Many Requests', description: 'The user has sent too many requests in a given amount of time.', category: '4xx' },
                { code: 431, name: 'Request Header Fields Too Large', description: 'The server is unwilling to process the request because its header fields are too large.', category: '4xx' },
                
                // 5xx Server Error
                { code: 500, name: 'Internal Server Error', description: 'A generic error message when an unexpected condition was encountered.', category: '5xx' },
                { code: 501, name: 'Not Implemented', description: 'The server does not support the functionality required to fulfill the request.', category: '5xx' },
                { code: 502, name: 'Bad Gateway', description: 'The server, while acting as a gateway or proxy, received an invalid response from the upstream server.', category: '5xx' },
                { code: 503, name: 'Service Unavailable', description: 'The server is currently unable to handle the request due to temporary overload or maintenance.', category: '5xx' },
                { code: 504, name: 'Gateway Timeout', description: 'The server, while acting as a gateway or proxy, did not receive a timely response from the upstream server.', category: '5xx' },
                { code: 505, name: 'HTTP Version Not Supported', description: 'The server does not support the HTTP protocol version used in the request.', category: '5xx' }
            ];

            const categories = {
                '1xx': 'Informational',
                '2xx': 'Success',
                '3xx': 'Redirection',
                '4xx': 'Client Error',
                '5xx': 'Server Error'
            };

            function highlightText(text, searchTerm) {
                if (!searchTerm) return text;
                const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                return text.replace(regex, '<span class="search-highlight">$1</span>');
            }

            function filterStatusCodes(searchTerm) {
                if (!searchTerm) return statusCodes;
                
                const term = searchTerm.toLowerCase();
                return statusCodes.filter(code => {
                    return code.code.toString().includes(term) ||
                           code.name.toLowerCase().includes(term) ||
                           code.description.toLowerCase().includes(term);
                });
            }

            function renderStatusCodes(filteredCodes, searchTerm) {
                container.innerHTML = '';
                
                if (filteredCodes.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: var(--spacing-lg);">No status codes found matching your search.</p>';
                    resultsCount.textContent = '0 results';
                    return;
                }

                resultsCount.textContent = `${filteredCodes.length} result${filteredCodes.length !== 1 ? 's' : ''}`;

                // Group by category
                const grouped = {};
                filteredCodes.forEach(code => {
                    if (!grouped[code.category]) {
                        grouped[code.category] = [];
                    }
                    grouped[code.category].push(code);
                });

                // Render each category
                Object.keys(categories).forEach(cat => {
                    if (!grouped[cat]) return;

                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'category-section';
                    
                    const title = document.createElement('h2');
                    title.className = 'category-title';
                    title.textContent = `${cat} ${categories[cat]}`;
                    categoryDiv.appendChild(title);

                    grouped[cat].forEach(code => {
                        const card = document.createElement('div');
                        card.className = 'status-code-card';
                        
                        const number = document.createElement('div');
                        number.className = 'status-code-number';
                        number.innerHTML = highlightText(code.code.toString(), searchTerm);
                        
                        const name = document.createElement('div');
                        name.className = 'status-code-name';
                        name.innerHTML = highlightText(code.name, searchTerm);
                        
                        const description = document.createElement('div');
                        description.className = 'status-code-description';
                        description.innerHTML = highlightText(code.description, searchTerm);
                        
                        card.appendChild(number);
                        card.appendChild(name);
                        card.appendChild(description);
                        categoryDiv.appendChild(card);
                    });

                    container.appendChild(categoryDiv);
                });
            }

            // Initial render
            renderStatusCodes(statusCodes, '');

            // Search functionality
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.trim();
                const filtered = filterStatusCodes(searchTerm);
                renderStatusCodes(filtered, searchTerm);
            });
        });
    </script>
