    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">UUID / NanoID Generator</h1>
            <p class="tool-description">Generate UUID v4 and NanoID identifiers</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="uuid-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="id-type" class="tool-label">ID Type</label>
                        <select id="id-type" class="tool-select">
                            <option value="uuid">UUID v4</option>
                            <option value="nanoid">NanoID</option>
                        </select>
                    </div>

                    <div class="tool-form-group" id="nanoid-length-group" style="display: none;">
                        <label for="nanoid-length" class="tool-label">NanoID Length</label>
                        <input type="number" id="nanoid-length" class="tool-input" value="21" min="1" max="100">
                    </div>

                    <div class="tool-form-group">
                        <label for="count" class="tool-label">Count</label>
                        <input type="number" id="count" class="tool-input" value="1" min="1" max="100">
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="generate-btn">Generate</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div class="tool-form-group" style="margin-top: var(--spacing-md);">
                        <label for="output" class="tool-label">
                            Generated IDs
                            <button type="button" class="tool-copy-btn" data-copy="output" title="Copy">📋</button>
                        </label>
                        <textarea id="output" class="tool-textarea tool-output tool-output-empty" readonly></textarea>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../assets/js/tools-core.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const idType = document.getElementById('id-type');
            const nanoidLengthGroup = document.getElementById('nanoid-length-group');
            const nanoidLength = document.getElementById('nanoid-length');
            const count = document.getElementById('count');
            const output = document.getElementById('output');
            const generateBtn = document.getElementById('generate-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            idType.addEventListener('change', function() {
                nanoidLengthGroup.style.display = this.value === 'nanoid' ? 'block' : 'none';
            });

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            generateBtn.addEventListener('click', function() {
                const type = idType.value;
                const num = parseInt(count.value) || 1;
                const ids = [];

                for (let i = 0; i < num; i++) {
                    if (type === 'uuid') {
                        ids.push(generateUUID());
                    } else {
                        const length = parseInt(nanoidLength.value) || 21;
                        ids.push(generateNanoID(length));
                    }
                }

                output.value = ids.join('\n');
                output.classList.remove('tool-output-empty');
                showFeedback(`Generated ${num} ${type.toUpperCase()}${num > 1 ? 's' : ''}!`, 'success');
            });

            resetBtn.addEventListener('click', function() {
                resetForm('uuid-form');
            });
        });
    </script>
