    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('json-input');
            const output = document.getElementById('json-output');
            const formatBtn = document.getElementById('format-btn');
            const validateBtn = document.getElementById('validate-btn');
            const minifyBtn = document.getElementById('minify-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            function formatJSON(text) {
                try {
                    const obj = JSON.parse(text);
                    return JSON.stringify(obj, null, 2);
                } catch (e) {
                    throw new Error('Invalid JSON: ' + e.message);
                }
            }

            function minifyJSON(text) {
                try {
                    const obj = JSON.parse(text);
                    return JSON.stringify(obj);
                } catch (e) {
                    throw new Error('Invalid JSON: ' + e.message);
                }
            }

            formatBtn.addEventListener('click', function() {
                const text = input.value.trim();
                if (!text) {
                    showFeedback('Please enter JSON', 'error');
                    return;
                }
                try {
                    const formatted = formatJSON(text);
                    output.value = formatted;
                    output.classList.remove('tool-output-empty');
                    showFeedback('JSON formatted successfully!', 'success');
                } catch (e) {
                    showFeedback(e.message, 'error');
                    output.value = '';
                    output.classList.add('tool-output-empty');
                }
            });

            validateBtn.addEventListener('click', function() {
                const text = input.value.trim();
                if (!text) {
                    showFeedback('Please enter JSON', 'error');
                    return;
                }
                try {
                    JSON.parse(text);
                    showFeedback('✓ Valid JSON!', 'success');
                } catch (e) {
                    showFeedback('✗ Invalid JSON: ' + e.message, 'error');
                }
            });

            minifyBtn.addEventListener('click', function() {
                const text = input.value.trim();
                if (!text) {
                    showFeedback('Please enter JSON', 'error');
                    return;
                }
                try {
                    const minified = minifyJSON(text);
                    output.value = minified;
                    output.classList.remove('tool-output-empty');
                    showFeedback('JSON minified successfully!', 'success');
                } catch (e) {
                    showFeedback(e.message, 'error');
                    output.value = '';
                    output.classList.add('tool-output-empty');
                }
            });

            resetBtn.addEventListener('click', function() {
                resetForm('json-form');
            });
        });
    </script>
