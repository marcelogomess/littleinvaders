    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">Regex Tester</h1>
            <p class="tool-description">Test regular expressions with live matching</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="regex-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="pattern" class="tool-label">Pattern</label>
                        <input type="text" id="pattern" class="tool-input" placeholder="/your regex pattern/">
                    </div>

                    <div class="tool-form-group">
                        <label class="tool-label">Flags</label>
                        <div class="tool-checkbox-group">
                            <label class="tool-checkbox">
                                <input type="checkbox" id="flag-g" value="g">
                                <span>Global (g)</span>
                            </label>
                            <label class="tool-checkbox">
                                <input type="checkbox" id="flag-i" value="i">
                                <span>Case Insensitive (i)</span>
                            </label>
                            <label class="tool-checkbox">
                                <input type="checkbox" id="flag-m" value="m">
                                <span>Multiline (m)</span>
                            </label>
                        </div>
                    </div>

                    <div class="tool-form-group">
                        <label for="test-string" class="tool-label">Test String</label>
                        <textarea id="test-string" class="tool-textarea" placeholder="Enter text to test against the pattern"></textarea>
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="test-btn">Test</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div class="tool-form-group" style="margin-top: var(--spacing-md);">
                        <label for="matches-output" class="tool-label">
                            Matches
                            <button type="button" class="tool-copy-btn" data-copy="matches-output" title="Copy">📋</button>
                        </label>
                        <textarea id="matches-output" class="tool-textarea tool-output tool-output-empty" readonly></textarea>
                    </div>

                    <div class="tool-form-group">
                        <label for="replace-output" class="tool-label">
                            Replace Preview
                            <button type="button" class="tool-copy-btn" data-copy="replace-output" title="Copy">📋</button>
                        </label>
                        <input type="text" id="replace-pattern" class="tool-input" placeholder="Replace pattern (optional)">
                        <textarea id="replace-output" class="tool-textarea tool-output tool-output-empty" style="margin-top: var(--spacing-sm);" readonly></textarea>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pattern = document.getElementById('pattern');
            const testString = document.getElementById('test-string');
            const matchesOutput = document.getElementById('matches-output');
            const replacePattern = document.getElementById('replace-pattern');
            const replaceOutput = document.getElementById('replace-output');
            const testBtn = document.getElementById('test-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            function getFlags() {
                let flags = '';
                if (document.getElementById('flag-g').checked) flags += 'g';
                if (document.getElementById('flag-i').checked) flags += 'i';
                if (document.getElementById('flag-m').checked) flags += 'm';
                return flags;
            }

            testBtn.addEventListener('click', function() {
                const regexPattern = pattern.value.trim();
                const text = testString.value.trim();

                if (!regexPattern) {
                    showFeedback('Please enter a regex pattern', 'error');
                    return;
                }

                if (!text) {
                    showFeedback('Please enter a test string', 'error');
                    return;
                }

                try {
                    const flags = getFlags();
                    const regex = new RegExp(regexPattern, flags);
                    const matches = text.match(regex);
                    const allMatches = [...text.matchAll(new RegExp(regexPattern, flags + 'g'))];

                    if (matches) {
                        matchesOutput.value = `Found ${allMatches.length} match(es):\n\n` + 
                            allMatches.map((m, i) => `Match ${i + 1}: "${m[0]}" at index ${m.index}`).join('\n');
                        matchesOutput.classList.remove('tool-output-empty');
                    } else {
                        matchesOutput.value = 'No matches found';
                        matchesOutput.classList.remove('tool-output-empty');
                    }

                    const replaceText = replacePattern.value.trim();
                    if (replaceText) {
                        replaceOutput.value = text.replace(regex, replaceText);
                        replaceOutput.classList.remove('tool-output-empty');
                    } else {
                        replaceOutput.value = '';
                        replaceOutput.classList.add('tool-output-empty');
                    }

                    showFeedback('Regex tested successfully!', 'success');
                } catch (e) {
                    showFeedback('Invalid regex: ' + e.message, 'error');
                    matchesOutput.value = '';
                    matchesOutput.classList.add('tool-output-empty');
                }
            });

            resetBtn.addEventListener('click', function() {
                resetForm('regex-form');
            });
        });
    </script>
