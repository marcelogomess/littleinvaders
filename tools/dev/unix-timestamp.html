    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputType = document.getElementById('input-type');
            const inputValue = document.getElementById('input-value');
            const timestampOutput = document.getElementById('timestamp-output');
            const isoOutput = document.getElementById('iso-output');
            const readableOutput = document.getElementById('readable-output');
            const convertBtn = document.getElementById('convert-btn');
            const currentBtn = document.getElementById('current-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            function updateOutputs(date) {
                const timestamp = dateToTimestamp(date);
                timestampOutput.value = timestamp;
                isoOutput.value = formatDate(date);
                readableOutput.value = date.toLocaleString();
                timestampOutput.classList.remove('tool-output-empty');
                isoOutput.classList.remove('tool-output-empty');
                readableOutput.classList.remove('tool-output-empty');
            }

            convertBtn.addEventListener('click', function() {
                const value = inputValue.value.trim();
                if (!value) {
                    showFeedback('Please enter a value', 'error');
                    return;
                }

                try {
                    let date;
                    if (inputType.value === 'timestamp') {
                        const ts = parseInt(value);
                        if (isNaN(ts)) {
                            throw new Error('Invalid timestamp');
                        }
                        date = timestampToDate(ts);
                    } else {
                        date = new Date(value);
                        if (isNaN(date.getTime())) {
                            throw new Error('Invalid date');
                        }
                    }
                    updateOutputs(date);
                    showFeedback('Converted successfully!', 'success');
                } catch (e) {
                    showFeedback('Error: ' + e.message, 'error');
                }
            });

            currentBtn.addEventListener('click', function() {
                const now = new Date();
                inputType.value = 'timestamp';
                inputValue.value = dateToTimestamp(now);
                updateOutputs(now);
                showFeedback('Current timestamp loaded!', 'success');
            });

            resetBtn.addEventListener('click', function() {
                resetForm('timestamp-form');
            });
        });
    </script>
