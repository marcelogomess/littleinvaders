    <div class="tool-page">
        <div class="tool-header">
            <h1 class="tool-title">Base64 Encode / Decode</h1>
            <p class="tool-description">Encode and decode Base64 strings</p>
        </div>

        <div class="tool-main">
            <div class="tool-container">
                <form id="base64-form" class="tool-form">
                    <div class="tool-form-group">
                        <label for="mode" class="tool-label">Mode</label>
                        <select id="mode" class="tool-select">
                            <option value="encode">Encode</option>
                            <option value="decode">Decode</option>
                        </select>
                    </div>

                    <div class="tool-form-group">
                        <label for="input-text" class="tool-label">Input</label>
                        <textarea id="input-text" class="tool-textarea" placeholder="Enter text to encode or Base64 to decode"></textarea>
                    </div>

                    <div class="tool-btn-group">
                        <button type="button" class="tool-btn" id="process-btn">Process</button>
                        <button type="button" class="tool-btn tool-btn-secondary" id="reset-btn">Reset</button>
                    </div>

                    <div id="feedback" class="tool-feedback"></div>

                    <div class="tool-form-group" style="margin-top: var(--spacing-md);">
                        <label for="output-text" class="tool-label">
                            Output
                            <button type="button" class="tool-copy-btn" data-copy="output-text" title="Copy">📋</button>
                        </label>
                        <textarea id="output-text" class="tool-textarea tool-output tool-output-empty" readonly></textarea>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../assets/js/tools-core.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mode = document.getElementById('mode');
            const input = document.getElementById('input-text');
            const output = document.getElementById('output-text');
            const processBtn = document.getElementById('process-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            function showFeedback(message, type) {
                feedback.className = `tool-feedback ${type} show`;
                feedback.textContent = message;
                setTimeout(() => feedback.classList.remove('show'), 3000);
            }

            processBtn.addEventListener('click', function() {
                const text = input.value.trim();
                if (!text) {
                    showFeedback('Please enter text', 'error');
                    return;
                }

                try {
                    if (mode.value === 'encode') {
                        output.value = base64Encode(text);
                        showFeedback('Encoded successfully!', 'success');
                    } else {
                        output.value = base64Decode(text);
                        showFeedback('Decoded successfully!', 'success');
                    }
                    output.classList.remove('tool-output-empty');
                } catch (e) {
                    showFeedback('Error: ' + e.message, 'error');
                    output.value = '';
                    output.classList.add('tool-output-empty');
                }
            });

            resetBtn.addEventListener('click', function() {
                resetForm('base64-form');
            });
        });
    </script>
</body>
