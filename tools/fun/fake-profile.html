    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generate-btn');
            const resetBtn = document.getElementById('reset-btn');
            const jsonBtn = document.getElementById('json-btn');
            const profileOutput = document.getElementById('profile-output');
            const feedback = document.getElementById('feedback');
            let currentProfile = null;

            const firstNames = ['John', 'Jane', 'Bob', 'Alice', 'Charlie', 'Diana'];
            const lastNames = ['Smith', 'Johnson', 'Williams', 'Brown', 'Jones'];
            const domains = ['example.com', 'test.com', 'demo.org'];

            function generateProfile() {
                const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
                const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
                const email = firstName.toLowerCase() + '.' + lastName.toLowerCase() + '@' + domains[Math.floor(Math.random() * domains.length)];
                const phone = '+1' + Math.floor(Math.random() * 9000000000 + 1000000000);
                const address = Math.floor(Math.random() * 9999) + ' Main St, City, State ' + Math.floor(Math.random() * 90000 + 10000);
                const bio = 'This is a generated fake profile for testing purposes.';

                return {
                    name: firstName + ' ' + lastName,
                    email: email,
                    phone: phone,
                    address: address,
                    bio: bio
                };
            }

            generateBtn.addEventListener('click', function() {
                currentProfile = generateProfile();
                let html = '<div style="line-height: 1.8;">';
                html += '<div style="margin-bottom: var(--spacing-xs);"><strong style="color: var(--accent-cyan);">Name:</strong> ' + currentProfile.name + '</div>';
                html += '<div style="margin-bottom: var(--spacing-xs);"><strong style="color: var(--accent-green);">Email:</strong> ' + currentProfile.email + ' <button class="tool-copy-btn" onclick="copyToClipboard(\'' + currentProfile.email + '\', this)">📋</button></div>';
                html += '<div style="margin-bottom: var(--spacing-xs);"><strong style="color: var(--accent-purple);">Phone:</strong> ' + currentProfile.phone + ' <button class="tool-copy-btn" onclick="copyToClipboard(\'' + currentProfile.phone + '\', this)">📋</button></div>';
                html += '<div style="margin-bottom: var(--spacing-xs);"><strong style="color: var(--accent-pink);">Address:</strong> ' + currentProfile.address + '</div>';
                html += '<div><strong style="color: var(--accent-cyan);">Bio:</strong> ' + currentProfile.bio + '</div>';
                html += '</div>';
                profileOutput.innerHTML = html;
                profileOutput.classList.remove('tool-output-empty');
                jsonBtn.style.display = 'inline-block';
                showFeedback('Profile generated!', 'success');
            });

            jsonBtn.addEventListener('click', function() {
                if (currentProfile) {
                    const json = JSON.stringify(currentProfile, null, 2);
                    downloadFile(json, 'profile.json', 'application/json');
                    showFeedback('Profile exported!', 'success');
                }
            });

            resetBtn.addEventListener('click', function() {
                profileOutput.innerHTML = '';
                profileOutput.classList.add('tool-output-empty');
                jsonBtn.style.display = 'none';
                currentProfile = null;
            });

            function showFeedback(message, type) {
                feedback.className = 'tool-feedback ' + type + ' show';
                feedback.textContent = message;
                setTimeout(function() { feedback.classList.remove('show'); }, 3000);
            }
        });
    </script>
