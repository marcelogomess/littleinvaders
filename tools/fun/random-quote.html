                <form id="quote-form" class="tool-form">
                    <div class="tool-form-group">

                        <button type="button" class="tool-btn tool-btn-secondary" id="copy-btn" style="margin-top: var(--spacing-sm); width: 100%; display: none;">Copy Quote</button>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const category = document.getElementById('category');
            const quoteOutput = document.getElementById('quote-output');
            const authorOutput = document.getElementById('author-output');
            const copyBtn = document.getElementById('copy-btn');
            const generateBtn = document.getElementById('generate-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            const quotes = {
                all: [
                    { text: 'The only way to do great work is to love what you do.', author: 'Steve Jobs' },
                    { text: 'Innovation distinguishes between a leader and a follower.', author: 'Steve Jobs' },
                    { text: 'Code is like humor. When you have to explain it, it\'s bad.', author: 'Cory House' }
                ],
                inspirational: [
                    { text: 'The only way to do great work is to love what you do.', author: 'Steve Jobs' },
                    { text: 'Believe you can and you\'re halfway there.', author: 'Theodore Roosevelt' }
                ],
                tech: [
                    { text: 'Code is like humor. When you have to explain it, it\'s bad.', author: 'Cory House' },
                    { text: 'First, solve the problem. Then, write the code.', author: 'John Johnson' }
                ],
                life: [
                    { text: 'Life is what happens to you while you\'re busy making other plans.', author: 'John Lennon' }
                ]
            };

            generateBtn.addEventListener('click', function() {
                const cat = category.value;
                const quoteList = quotes[cat] || quotes.all;
                const quote = quoteList[Math.floor(Math.random() * quoteList.length)];
                
                quoteOutput.textContent = '"' + quote.text + '"';
                authorOutput.textContent = '— ' + quote.author;
                quoteOutput.classList.remove('tool-output-empty');
                copyBtn.style.display = 'block';
                showFeedback('Quote generated!', 'success');
            });

            copyBtn.addEventListener('click', function() {
                const text = quoteOutput.textContent + ' ' + authorOutput.textContent;
                copyToClipboard(text, copyBtn);
            });

            resetBtn.addEventListener('click', function() {
                quoteOutput.textContent = '';
                authorOutput.textContent = '';
                quoteOutput.classList.add('tool-output-empty');
                copyBtn.style.display = 'none';
            });

            function showFeedback(message, type) {
                feedback.className = 'tool-feedback ' + type + ' show';
                feedback.textContent = message;
                setTimeout(function() { feedback.classList.remove('show'); }, 3000);
            }
        });
    </script>
