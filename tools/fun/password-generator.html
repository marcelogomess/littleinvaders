    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const length = document.getElementById('length');
            const lengthValue = document.getElementById('length-value');
            const uppercase = document.getElementById('uppercase');
            const lowercase = document.getElementById('lowercase');
            const numbers = document.getElementById('numbers');
            const symbols = document.getElementById('symbols');
            const passwordOutput = document.getElementById('password-output');
            const strength = document.getElementById('strength');
            const generateBtn = document.getElementById('generate-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            length.addEventListener('input', function() {
                lengthValue.textContent = this.value;
            });

            function generatePassword(len, useUpper, useLower, useNum, useSym) {
                let chars = '';
                if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                if (useLower) chars += 'abcdefghijklmnopqrstuvwxyz';
                if (useNum) chars += '0123456789';
                if (useSym) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
                
                if (!chars) return '';
                
                let password = '';
                for (let i = 0; i < len; i++) {
                    password += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return password;
            }

            function checkStrength(pwd) {
                let score = 0;
                if (pwd.length >= 12) score++;
                if (pwd.length >= 16) score++;
                if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
                if (/\d/.test(pwd)) score++;
                if (/[^a-zA-Z0-9]/.test(pwd)) score++;
                
                if (score <= 2) return { text: 'Weak', color: '#ff6666' };
                if (score <= 4) return { text: 'Medium', color: '#ffaa00' };
                return { text: 'Strong', color: '#66ff66' };
            }

            generateBtn.addEventListener('click', function() {
                const len = parseInt(length.value);
                const pwd = generatePassword(len, uppercase.checked, lowercase.checked, numbers.checked, symbols.checked);
                
                if (!pwd) {
                    showFeedback('Please select at least one option', 'error');
                    return;
                }
                
                passwordOutput.value = pwd;
                passwordOutput.classList.remove('tool-output-empty');
                
                const strengthInfo = checkStrength(pwd);
                strength.textContent = 'Strength: ' + strengthInfo.text;
                strength.style.color = strengthInfo.color;
                strength.classList.remove('tool-output-empty');
                
                showFeedback('Password generated!', 'success');
            });

            resetBtn.addEventListener('click', function() {
                resetForm('password-form');
                strength.textContent = '';
                strength.classList.add('tool-output-empty');
            });

            function showFeedback(message, type) {
                feedback.className = 'tool-feedback ' + type + ' show';
                feedback.textContent = message;
                setTimeout(function() { feedback.classList.remove('show'); }, 3000);
            }
        });
    </script>
