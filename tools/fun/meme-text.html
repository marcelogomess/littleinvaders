    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('input-text');
            const style = document.getElementById('style');
            const output = document.getElementById('output-text');
            const generateBtn = document.getElementById('generate-btn');
            const resetBtn = document.getElementById('reset-btn');
            const feedback = document.getElementById('feedback');

            function spongebob(text) {
                return text.split('').map(function(char, i) {
                    return i % 2 === 0 ? char.toLowerCase() : char.toUpperCase();
                }).join('');
            }

            function zalgo(text) {
                const zalgoChars = ['̷', '̸', '̵', '̴'];
                return text.split('').map(function(char) {
                    return char + zalgoChars[Math.floor(Math.random() * zalgoChars.length)];
                }).join('');
            }

            function upsideDown(text) {
                const map = { a: 'ɐ', b: 'q', c: 'ɔ', d: 'p', e: 'ǝ', f: 'ɟ', g: 'ƃ', h: 'ɥ', i: 'ᴉ', j: 'ɾ', k: 'ʞ', l: 'l', m: 'ɯ', n: 'u', o: 'o', p: 'd', q: 'b', r: 'ɹ', s: 's', t: 'ʇ', u: 'n', v: 'ʌ', w: 'ʍ', x: 'x', y: 'ʎ', z: 'z' };
                return text.split('').map(function(char) {
                    return map[char.toLowerCase()] || char;
                }).reverse().join('');
            }

            generateBtn.addEventListener('click', function() {
                const text = input.value.trim();
                if (!text) {
                    showFeedback('Please enter text', 'error');
                    return;
                }

                let result = '';
                switch(style.value) {
                    case 'spongebob': result = spongebob(text); break;
                    case 'zalgo': result = zalgo(text); break;
                    case 'upside': result = upsideDown(text); break;
                }

                output.value = result;
                output.classList.remove('tool-output-empty');
                showFeedback('Meme text generated!', 'success');
            });

            resetBtn.addEventListener('click', function() {
                resetForm('meme-form');
            });

            function showFeedback(message, type) {
                feedback.className = 'tool-feedback ' + type + ' show';
                feedback.textContent = message;
                setTimeout(function() { feedback.classList.remove('show'); }, 3000);
            }
        });
    </script>
